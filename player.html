<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interaction — Interaction Experiments</title>
<style>
  :root {
    --bg: #0c0c0d;
    --stage: #0f0f10;
    --ink: #f2f1ec;
    --muted: #8d8d88;
    --faint: #5c5c58;
    --line: rgba(255,255,255,0.09);
    --red: #e40202;            /* the ONLY red — the interaction title */
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: clamp(1.25rem, 3.5vw, 2.5rem) clamp(1.25rem, 5vw, 3.5rem) clamp(1.5rem, 4vw, 3rem);
  }
  .shell { width: 100%; max-width: 1320px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            margin-bottom: clamp(1.2rem, 2.5vw, 1.8rem); }
  .back { font-family: var(--mono); font-size: 0.76rem; letter-spacing: 0.04em; color: var(--muted);
          text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; transition: color 180ms ease; }
  .back span { display: inline-block; transition: transform 300ms var(--ease); }
  .back:hover { color: var(--ink); }
  .back:hover span { transform: translateX(-3px); }
  .label { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
           color: var(--faint); text-align: right; }

  .head { margin-bottom: clamp(1rem, 2.2vw, 1.5rem); }
  .title { font-size: clamp(1.9rem, 5vw, 3.1rem); line-height: 1.0; letter-spacing: -0.03em;
           font-weight: 660; color: var(--ink); }       /* white; red is only the index hover state */
  .caption { color: var(--muted); font-size: clamp(0.95rem, 1.6vw, 1.05rem); max-width: 66ch; margin-top: 0.7rem; }
  .caption em { color: var(--ink); font-style: normal; font-weight: 600; }

  /* stage = clip window. aspect is set per-study once the element is measured. */
  .stage { position: relative; width: 100%; background: var(--stage);
           border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
           margin-top: clamp(1rem, 2.5vw, 1.6rem); min-height: 320px; }
  .stage.is-scroll { flex: 1; }
  .scaler { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .stage iframe { border: 0; display: block; background: #0c0c0d; opacity: 0; transition: opacity 240ms ease; }
  .stage.ready iframe { opacity: 1; }
  /* scroll mode: iframe simply fills the stage and scrolls */
  .stage.is-scroll iframe { position: absolute; inset: 0; width: 100%; height: 100%; }

  .stage__loading { position: absolute; inset: 0; display: grid; place-items: center;
                    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em;
                    text-transform: uppercase; color: var(--faint); pointer-events: none;
                    transition: opacity 300ms ease; z-index: 2; }
  .stage.ready .stage__loading { opacity: 0; }

  .foot { margin-top: 1rem; display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center;
          font-family: var(--mono); font-size: 0.72rem; color: var(--faint); letter-spacing: 0.04em; }
  .foot a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
  .foot a:hover { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { .back span, .stage iframe { transition: none; } }
</style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="back" href="./index.html"><span>&larr;</span> Interaction Experiments</a>
      <span class="label" id="label"></span>
    </div>
    <div class="head">
      <h1 class="title" id="title">Interaction</h1>
      <p class="caption" id="caption"></p>
    </div>
    <div class="stage" id="stage">
      <div class="stage__loading" id="loading">loading interaction…</div>
      <div class="scaler" id="scaler"><iframe id="frame" title="" allow="fullscreen"></iframe></div>
    </div>
    <div class="foot">
      <span id="srcnote"></span>
      <a id="openlive" href="#" target="_blank" rel="noopener">Open in a new tab &#8599;</a>
    </div>
  </div>

  <script>
    // Each study loads its real deployed page, then we ISOLATE the interactive
    // element so the experiment opens straight on the interaction — no loader,
    // no hero, no chrome — while the element's own JS keeps the interaction live.
    // Same-origin (lobzyjay.github.io) studies can be cropped/scrolled precisely;
    // cross-origin ones fall back to a plain embed.
    var STUDIES = {
      "apex-footer": {
        title: "Footer Interaction", label: "Apex footer · self-built",
        caption: "Blob tags <em>float in one-by-one</em> and un-strike on hover; a hand that tracks your cursor.",
        src: "./apex-footer/", srcnote: "self-built in this repo",
        mode: "crop", find: { selector: ".footer" }, viewportW: 1280, hide: [".page-spacer"]
      },
      "stsl-hero": {
        title: "Hero Atmosphere", label: "Systemspec · cursor-aware",
        caption: "A braille dot-field — <em>move your cursor over it</em> and the texture pushes away from the pointer.",
        src: "https://lobzyjay.github.io/Systemspec-website-redesign/design/", srcnote: "Systemspec design system",
        mode: "crop", find: { within: ".group\\/stage", text: "HERO ATMOSPHERE" }, viewportW: 1440
      },
      "stsl-footer": {
        title: "Footer Atmosphere", label: "Systemspec · cursor-aware",
        caption: "Same canvas physics as the hero, <em>warped onto the espresso footer surface</em>. Move your cursor over it.",
        src: "https://lobzyjay.github.io/Systemspec-website-redesign/design/", srcnote: "Systemspec design system",
        mode: "crop", find: { within: ".group\\/stage", text: "FOOTER ATMOSPHERE" }, viewportW: 1440
      },
      "stsl-speedometer": {
        title: "Speedometer Mouse Interaction", label: "STSL case study · drag the scrubber",
        caption: "<em>Drag the day-scrubber</em> — it drives the running-cost bars and the speedometer gauge.",
        src: "https://lobzyjay.github.io/Portfolio/case-study/stsl/", srcnote: "STSL case study · day-cost",
        mode: "crop", find: { selector: ".day-cost" }, viewportW: 1280,
        forceVisible: [".day-cost", ".chapter--swiss"]
      },
      "agmb-viz": {
        title: "Dithered Tile Viz", label: "AGMB design system · cursor-aware",
        caption: "Per-product silhouettes Bayer-dithered into dot fields — <em>move your cursor over a tile</em> to displace the dots (iron-filings repulsion).",
        src: "https://lobzyjay.github.io/agmb-design-system/", srcnote: "AGMB design system",
        mode: "crop", find: { within: "section", text: "Dithered tile viz", canvasGrid: true }, viewportW: 1280
      },
      "voltex-hero": {
        title: "Hero Scene", label: "Voltex · Three.js + Lenis",
        caption: "A <em>WebGL hero scene</em> behind the type, with HUD overlays. Scroll the stage.",
        src: "https://lobzyjay.github.io/Voltex/", srcnote: "Voltex",
        mode: "scroll", scrollTo: 0, hide: ["[class*='loader']", "[id*='loader']", "[class*='preloader']"]
      },
      "pacific-turbine": {
        title: "Wind Turbine", label: "Pacific Blue · Three.js GLB",
        caption: "A GLB turbine that <em>orbits with the scroll</em> while the section sticks and crossfades. Scroll the stage.",
        src: "https://lobzyjay.github.io/Pacific-blue/", srcnote: "Pacific Blue",
        mode: "scroll", hide: ["#site-header", "#loader-turbine", "header"], find: { selector: "#gen-section" }, viewportW: 1280
      }
    };

    var id = new URLSearchParams(location.search).get("study");
    var s = STUDIES[id] || { title: "Not found", label: "—",
      caption: "Unknown study — <em>back to the index</em>.", src: "", srcnote: "", mode: "embed" };

    var stage = document.getElementById("stage");
    var scaler = document.getElementById("scaler");
    var frame = document.getElementById("frame");
    var loading = document.getElementById("loading");
    var openlive = document.getElementById("openlive");
    var cropState = null;   // {left, top, k} once a crop is applied — used for touch mapping

    document.title = s.title + " — Interaction Experiments";
    document.getElementById("title").textContent = s.title;
    document.getElementById("label").textContent = s.label;
    document.getElementById("caption").innerHTML = s.caption;
    document.getElementById("srcnote").textContent = s.srcnote;
    if (s.src) openlive.href = s.src; else openlive.style.display = "none";

    function reveal() { stage.classList.add("ready"); }

    function findEl(doc, find) {
      if (!find) return null;
      if (find.selector) return doc.querySelector(find.selector);
      if (find.within && find.text) {
        var cands = [].slice.call(doc.querySelectorAll(find.within));
        var rx = new RegExp(find.text, "i");
        cands = cands.filter(function (el) { return rx.test(el.textContent || ""); });
        cands.sort(function (a, b) { return a.getBoundingClientRect().height - b.getBoundingClientRect().height; });
        var base = cands[0] || null;
        if (base && find.canvasGrid) {
          // narrow to the grid of canvases (excludes the section's heading/caption)
          var cv = [].slice.call(base.querySelectorAll("canvas"));
          if (cv.length >= 2) {
            var anc = []; for (var n = cv[0]; n; n = n.parentElement) anc.push(n);
            for (var i = 1; i < cv.length; i++) {
              var p = []; for (var m = cv[i]; m; m = m.parentElement) p.push(m);
              anc = anc.filter(function (x) { return p.indexOf(x) >= 0; });
            }
            return anc[0] || base;
          }
        }
        return base;
      }
      return null;
    }

    // Force scroll-reveal-gated elements visible (GSAP sets inline opacity:0 /
    // transform; injected !important overrides it) so a cropped demo isn't blank.
    function forceVisible(doc, sels) {
      if (!sels || !sels.length) return;
      try {
        var st = doc.createElement("style");
        st.textContent = sels.join(",") + "{opacity:1 !important;transform:none !important;visibility:visible !important;}";
        doc.head.appendChild(st);
      } catch (e) {}
    }

    function hideChrome(doc, hide) {
      (hide || []).forEach(function (sel) {
        try { [].slice.call(doc.querySelectorAll(sel)).forEach(function (el) { el.style.display = "none"; }); } catch (e) {}
      });
      // generic: kill full-viewport fixed overlays / loaders sitting on top
      try {
        var vw = doc.documentElement.clientWidth, vh = doc.documentElement.clientHeight;
        [].slice.call(doc.querySelectorAll("body *")).forEach(function (el) {
          var cs = el.ownerDocument.defaultView.getComputedStyle(el);
          if (cs.position === "fixed") {
            var r = el.getBoundingClientRect();
            var z = parseInt(cs.zIndex, 10) || 0;
            if (r.width >= vw * 0.9 && r.height >= vh * 0.9 && z >= 50) el.style.display = "none";
          }
        });
      } catch (e) {}
    }

    function applyCrop() {
      var win = frame.contentWindow, doc = frame.contentDocument;
      // 1) render at a known desktop width AND a realistic height first. Using a real
      //    height (not a collapsed 10px) keeps vh/dvh layouts from collapsing, which
      //    otherwise makes scrollHeight measure short and clips the bottom of the crop.
      frame.style.width = s.viewportW + "px";
      frame.style.height = (window.innerHeight || 900) + "px";
      void doc.documentElement.offsetWidth;
      hideChrome(doc, s.hide);                              // hide chrome/fillers BEFORE measuring height
      forceVisible(doc, s.forceVisible);                    // un-gate scroll-reveal demos
      void doc.documentElement.offsetWidth;
      // size the iframe to the (now stable) content height so nothing is clipped
      frame.style.height = doc.documentElement.scrollHeight + "px";
      void doc.documentElement.offsetWidth;
      // 2) measure the element at the final layout
      var el = findEl(doc, s.find);
      if (!el) return false;
      var r = el.getBoundingClientRect();
      var left = r.left + win.scrollX, top = r.top + win.scrollY, w = r.width, h = r.height;
      if (!w || !h) return false;
      // guarantee the iframe is at least tall enough to contain the cropped element
      if (top + h > parseInt(frame.style.height, 10)) frame.style.height = (top + h + 80) + "px";

      // 3) UNIFORM PLAYER FRAME: the stage is a consistent box (fills the available
      //    area, same for every study); the element is scaled to CONTAIN within it
      //    — never upscaled — and centered, so nothing is cut and all studies share
      //    one frame size. The stage background letterboxes around it.
      stage.style.aspectRatio = "auto";
      stage.style.minHeight = "0";
      stage.style.height = "";                              // reset to read available space
      var availW = stage.clientWidth;                       // = shell width (consistent)
      var stageTop = stage.getBoundingClientRect().top;
      var availH = Math.max(300, window.innerHeight - stageTop - 80);
      stage.style.height = availH + "px";
      var pad = 28;
      var k = Math.min(1, (availW - pad * 2) / w, (availH - pad * 2) / h);
      var sw = w * k, sh = h * k;
      var offX = Math.round((availW - sw) / 2), offY = Math.round((availH - sh) / 2);
      scaler.style.left = offX + "px";
      scaler.style.top = offY + "px";
      frame.style.transform = "translate(" + (-left) + "px," + (-top) + "px)";
      scaler.style.transform = "scale(" + k + ")";
      cropState = { left: left, top: top, k: k, offX: offX, offY: offY };   // touch mapping
      return true;
    }

    function applyScroll() {
      var win = frame.contentWindow, doc = frame.contentDocument;
      stage.classList.add("is-scroll");
      hideChrome(doc, s.hide);
      var target = (typeof s.scrollTo === "number") ? s.scrollTo : null;
      if (s.find) { var el = findEl(doc, s.find); if (el) target = el.getBoundingClientRect().top + win.scrollY; }
      if (target != null) { try { win.scrollTo(0, target); } catch (e) {} }
      return true;
    }

    function onLoad() {
      var ok = false;
      if (s.mode === "crop" || s.mode === "scroll") {
        try {
          // throws if cross-origin (e.g. local dev) — falls back to plain embed
          var test = frame.contentDocument.title; void test;
          ok = (s.mode === "crop") ? applyCrop() : applyScroll();
        } catch (e) { ok = false; }
      }
      if (!ok && s.mode !== "embed") {
        // fallback: plain scrollable embed
        stage.classList.add("is-scroll");
        frame.style.cssText = "";
      }
      // re-crop after layout / fonts / scroll-reveal settle (fixes races where the
      // element measured short or mid-reveal on first paint)
      if (ok && s.mode === "crop") {
        setTimeout(function () { try { applyCrop(); } catch (e) {} }, 600);
        setTimeout(function () { try { applyCrop(); } catch (e) {} }, 1500);
      }
      reveal();
    }

    // Touch playability: cursor-driven demos have no hover on phones. Map a finger
    // drag over the stage to a synthetic mousemove inside the (same-origin) iframe,
    // translated through the crop transform, so the demo reacts to touch too.
    function dispatchPointer(clientX, clientY) {
      if (!cropState) return;
      try {
        var win = frame.contentWindow, doc = frame.contentDocument;
        var cx = cropState.left + (clientX - (cropState.offX || 0)) / cropState.k;
        var cy = cropState.top + (clientY - (cropState.offY || 0)) / cropState.k;
        var target = doc.elementFromPoint(cx, cy) || doc.body;
        ["pointermove", "mousemove"].forEach(function (type) {
          target.dispatchEvent(new win.MouseEvent(type, { clientX: cx, clientY: cy, bubbles: true }));
        });
      } catch (e) {}
    }
    stage.addEventListener("touchmove", function (e) {
      if (!cropState) return;          // scroll-mode demos keep native touch-scroll
      var t = e.touches[0]; if (!t) return;
      var r = stage.getBoundingClientRect();
      dispatchPointer(t.clientX - r.left, t.clientY - r.top);
      e.preventDefault();              // crop demos: let the finger "draw", not scroll
    }, { passive: false });
    stage.addEventListener("touchstart", function (e) {
      if (!cropState) return;
      var t = e.touches[0]; if (!t) return;
      var r = stage.getBoundingClientRect();
      dispatchPointer(t.clientX - r.left, t.clientY - r.top);
    }, { passive: true });

    if (s.src) {
      frame.title = s.title;
      frame.addEventListener("load", onLoad);
      // settle re-crop on resize (crop only)
      var rt;
      window.addEventListener("resize", function () {
        if (s.mode !== "crop") return;
        clearTimeout(rt); rt = setTimeout(function () { try { applyCrop(); } catch (e) {} }, 150);
      });
      // safety reveal if load never fires
      setTimeout(reveal, 6000);
      frame.src = s.src;
    } else { reveal(); }
  </script>
</body>
</html>

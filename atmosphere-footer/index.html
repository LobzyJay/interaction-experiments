<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Footer Atmosphere · Loop 1 (Reactive)</title>
<!--
  Standalone extraction of FooterAtmosphereReactive.
  Source (verbatim physics + wave):
    packages/brand-stsl/src/components/FooterAtmosphereReactive.tsx
      - Constants (CELL_W/H, COL_X, ROW_Y, DOT_R, FIELD_*, SPRING, DAMPING): lines 19-28
      - Dot struct: lines 30-37
      - hexToRgb: lines 45-53
      - buildDots: lines 80-98
      - resize / dpr handling: lines 100-109
      - mouse onMove/onLeave: lines 121-129
      - drawStatic: lines 137-148
      - wave constants (WAVE_PERIOD_MS 14000, WAVE_BAND 520, WAVE_PEAK_A 0.62, SQRT2 axis): lines 170-175
      - forcefield + diagonal wave tick(): lines 177-244
  Colors/fonts from packages/brand-stsl/src/styles.css
    accent teal #017A6A, bg-inverse espresso #0B0C0F, Source Serif 4 / Inter / JetBrains Mono.
  React shell (useEffect/useRef) unwrapped into DOMContentLoaded + <canvas> + RAF.
-->
<style>
  :root {
    --accent-default: #017A6A;
    --bg-inverse: #0B0C0F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg-inverse);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  .demo-stage {
    position: relative;
    width: 900px;
    height: 520px;
    max-width: calc(100vw - 32px);
    background: var(--bg-inverse);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 40px rgba(0,0,0,0.5);
  }

  .demo-stage .field {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  /* Espresso base — sits behind the canvas (source render line 290). */
  .demo-stage .field .base {
    position: absolute;
    inset: 0;
    background: var(--bg-inverse);
  }
  .demo-stage canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    contain: layout paint;
  }

  .demo-label {
    position: absolute;
    left: 20px;
    bottom: 18px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    pointer-events: none;
    z-index: 2;
  }
  .demo-label .title {
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(251, 248, 242, 0.82);
  }
  .demo-label .tag {
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-default);
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="demo-stage" id="stage">
    <div class="field" id="wrap" aria-hidden="true">
      <div class="base"></div>
      <canvas id="canvas"></canvas>
    </div>
    <div class="demo-label">
      <span class="title">Footer Atmosphere · Loop 1 (Reactive)</span>
      <span class="tag">cursor-aware</span>
    </div>
  </div>

<script>
// ---- Constants lifted verbatim from FooterAtmosphereReactive.tsx (lines 19-28) ----
const CELL_W = 24;
const CELL_H = 34;
const COL_X  = [6, 18];
const ROW_Y  = [6, 17, 28];
const DOT_R  = 1.2;

const FIELD_RADIUS = 130;
const FIELD_PUSH   = 38;
const SPRING       = 0.075;
const DAMPING      = 0.82;

// hexToRgb (lines 45-53)
function hexToRgb(hex) {
  const m = hex.replace('#', '').match(/.{2}/g);
  if (!m || m.length < 3) return [1, 122, 106];
  return [
    parseInt(m[0] ?? '00', 16),
    parseInt(m[1] ?? '00', 16),
    parseInt(m[2] ?? '00', 16),
  ];
}
function readToken(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.getElementById('wrap');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  if (!ctx) return;

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const [r, g, b] = hexToRgb(readToken('--accent-default', '#017A6A'));

  const wrapEl = wrap;
  const canvasEl = canvas;
  const context = ctx;

  let dots = [];
  let cssW = 0;
  let cssH = 0;

  // buildDots (lines 80-98)
  function buildDots(width, height) {
    const next = [];
    const cols = Math.ceil(width / CELL_W) + 1;
    const rows = Math.ceil(height / CELL_H) + 1;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ox = c * CELL_W;
        const oy = r * CELL_H;
        for (const cx of COL_X) {
          for (const cy of ROW_Y) {
            const x = ox + cx;
            const y = oy + cy;
            next.push({ bx: x, by: y, cx: x, cy: y, vx: 0, vy: 0 });
          }
        }
      }
    }
    return next;
  }

  // resize / dpr handling (lines 100-109)
  function resize() {
    const rect = wrapEl.getBoundingClientRect();
    cssW = rect.width > 0 ? rect.width : 480;
    cssH = rect.height > 0 ? rect.height : 480;
    canvasEl.width = Math.round(cssW * dpr);
    canvasEl.height = Math.round(cssH * dpr);
    canvasEl.style.width  = `${cssW}px`;
    canvasEl.style.height = `${cssH}px`;
    dots = buildDots(cssW, cssH);
  }
  resize();

  let ro = null;
  if (typeof ResizeObserver !== 'undefined') {
    ro = new ResizeObserver(() => resize());
    ro.observe(wrapEl);
  }

  let mouseX = -1000;
  let mouseY = -1000;

  function onMove(e) {
    const rect = wrapEl.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  }
  function onLeave() {
    mouseX = -1000;
    mouseY = -1000;
  }

  // Listen on the stage card so the cursor anywhere engages the forcefield.
  const root = wrapEl.closest('.demo-stage') ?? wrapEl.parentElement ?? wrapEl;
  root.addEventListener('mousemove', onMove, { passive: true });
  root.addEventListener('mouseleave', onLeave);

  // drawStatic (lines 137-148)
  function drawStatic() {
    context.save();
    context.scale(dpr, dpr);
    context.clearRect(0, 0, cssW, cssH);
    context.fillStyle = `rgba(${r}, ${g}, ${b}, 0.20)`;
    for (const d of dots) {
      context.beginPath();
      context.arc(d.bx, d.by, DOT_R, 0, Math.PI * 2);
      context.fill();
    }
    context.restore();
  }

  if (reduced) {
    drawStatic();
    return;
  }

  let raf = 0;

  // Ambient wave — diagonal 45° sweep band (lines 170-175)
  const WAVE_PERIOD_MS = 14000;
  const WAVE_BAND      = 520;  // px — width of the brightness band
  const WAVE_BASE_A    = 0;    // outside the wave — dots invisible
  const WAVE_PEAK_A    = 0.62; // peak at the wave center
  const SQRT2          = Math.SQRT2;
  let waveStart = performance.now();

  // forcefield + diagonal wave tick (lines 177-244)
  function tick(now) {
    context.save();
    context.scale(dpr, dpr);
    context.clearRect(0, 0, cssW, cssH);

    const fieldR2 = FIELD_RADIUS * FIELD_RADIUS;

    // Diagonal wave position — projected onto the (1,1)/√2 axis.
    const phase    = ((now - waveStart) % WAVE_PERIOD_MS) / WAVE_PERIOD_MS;
    const projMax  = (cssW + cssH) / SQRT2;
    const wavePos  = -WAVE_BAND + phase * (projMax + WAVE_BAND * 2);

    for (const d of dots) {
      if (mouseX > -500) {
        const dx = d.cx - mouseX;
        const dy = d.cy - mouseY;
        const d2 = dx * dx + dy * dy;
        if (d2 < fieldR2 && d2 > 0.01) {
          const dist = Math.sqrt(d2);
          const falloff = 1 - dist / FIELD_RADIUS;
          const push = FIELD_PUSH * falloff;
          const nx = dx / dist;
          const ny = dy / dist;
          const tx = d.bx + nx * push;
          const ty = d.by + ny * push;
          d.vx += (tx - d.cx) * 0.18;
          d.vy += (ty - d.cy) * 0.18;
        } else {
          d.vx += (d.bx - d.cx) * SPRING;
          d.vy += (d.by - d.cy) * SPRING;
        }
      } else {
        d.vx += (d.bx - d.cx) * SPRING;
        d.vy += (d.by - d.cy) * SPRING;
      }

      d.vx *= DAMPING;
      d.vy *= DAMPING;
      d.cx += d.vx;
      d.cy += d.vy;
    }

    // Per-dot alpha — wave brightness peaks at band center and falls
    // off cosine-smooth to either edge.
    for (const d of dots) {
      const proj = (d.cx + d.cy) / SQRT2;
      const ax = Math.abs(proj - wavePos);
      if (ax >= WAVE_BAND) continue;
      const t = 1 - ax / WAVE_BAND;
      const eased = (1 - Math.cos(t * Math.PI)) * 0.5;
      const alpha = WAVE_BASE_A + (WAVE_PEAK_A - WAVE_BASE_A) * eased;
      if (alpha < 0.02) continue;
      context.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      context.beginPath();
      context.arc(d.cx, d.cy, DOT_R, 0, Math.PI * 2);
      context.fill();
    }

    context.restore();
    raf = requestAnimationFrame(tick);
  }

  raf = requestAnimationFrame(tick);
});
</script>
</body>
</html>
